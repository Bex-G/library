<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Let's Get Bookish</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <script src="script.js" defer></script>
  <body>
    <div id="content">
      <div class="header">
        <h1>My Library</h1>
      </div>
      <div id="displayContainer">
        <table id="display">
          <tr>
            <th id="titleHeader">Title</th>
            <th id="authorHeader">Author</th>
            <th id="statusHeader">Status</th>
            <th id="deleteHeader"></th>
          </tr>
        </table>
      </div>
      <button id="drawerBtn"><span class="caret">▼</span></button>
      <div class="off-screen" id="formContainer">
        <form action="" method="get" id="myForm" name="bookForm">
          <label for="title">*Title:</label>
          <input type="text" id="titleInput" required />
          <label for="author">*Author:</label>
          <input type="text" id="authorInput" required />

          <fieldset>
            <p>Have you read this book?</p>
            <span>
              <label for="read">Yes</label><br />
              <input type="radio" id="read" name="statusInput" value="read" />
              <label for="tbr">No</label><br />
              <input
                type="radio"
                id="tbr"
                name="statusInput"
                value="tbr"
                checked
              />
            </span>
          </fieldset>

          <input type="submit" value="Add Book" />
          <button id="cancelBtn">Cancel</button>
        </form>
      </div>
    </div>
  </body>
</html>
